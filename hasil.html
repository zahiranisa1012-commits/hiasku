<section class="container">
<h1>Hasil Pembelian</h1>

<p>Nama: <span id="nama"></span></p>
<p>Email: <span id="email"></span></p>

<h2>Pesanan:</h2>
<ul id="data"></ul>

<h3>Total: Rp <span id="total"></span></h3>

<p>📞 Admin: 0812-3456-7890</p>
<p>📧 greenleaf@gmail.com</p>
</section>

<script>
let user=JSON.parse(localStorage.getItem("user"));
let cart=JSON.parse(localStorage.getItem("cart"))||[];

document.getElementById("nama").innerText=user.nama;
document.getElementById("email").innerText=user.email;

let total=0;

cart.forEach(item=>{
let sub=item.harga*item.qty;
document.getElementById("data").innerHTML+=
`<li>${item.nama} (${item.qty}) - Rp ${sub}</li>`;
total+=sub;
});

document.getElementById("total").innerText=total;
</script>
