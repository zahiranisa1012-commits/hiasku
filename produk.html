<script>
function add(nama,harga,id){
let qty = document.getElementById(id).value;

let cart = JSON.parse(localStorage.getItem("cart")) || [];
cart.push({nama,harga,qty:parseInt(qty)});
localStorage.setItem("cart",JSON.stringify(cart));

alert("Ditambahkan!");
}
</script>
